# =============================================================================
# Workflow de GitHub Actions: valida el código y corre los tests de Playwright
# =============================================================================
# Un "workflow" es una receta que GitHub ejecuta sola, en una máquina virtual, cuando ocurre un
# evento (acá: push o pull request).
#
# IMPORTANTE: GitHub solo lee workflows de la carpeta .github/workflows de la RAÍZ de un
# repositorio. Este archivo es la versión para cuando copiás la plantilla a su propio repositorio.
# Si la plantilla vive dentro del repositorio del playbook, el workflow que corre es el de la raíz
# (.github/workflows/automation.yml), que hace lo mismo apuntando a la carpeta plantilla-automation/.
# =============================================================================

name: Playwright Tests

# Cuándo se ejecuta.
on:
  push:
    branches: [main, master] # Al subir cambios a estas ramas.
  pull_request:
    branches: [main, master] # Al abrir o actualizar un Pull Request hacia estas ramas.
  workflow_dispatch: # Permite correrlo a mano desde la pestaña Actions.

jobs:
  test:
    # Cancela el job si tarda más de 60 minutos (evita consumir minutos por un test colgado).
    timeout-minutes: 60
    # Máquina virtual donde corre.
    runs-on: ubuntu-latest

    steps:
      # 1. Descarga el código del repositorio en la máquina virtual.
      - uses: actions/checkout@v4

      # 2. Instala Node.js (versión LTS = soporte a largo plazo).
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      # 3. Instala las dependencias exactas de package-lock.json ("ci" es más estricto y rápido que "install").
      - name: Install dependencies
        run: npm ci

      # 4. Controles de calidad ANTES de abrir navegadores (fallan rápido y cuestan poco):
      #    tipos de TypeScript, reglas de ESLint (sin esperas fijas ni test.only) y formato Prettier.
      - name: Verificar código (tipos, lint y formato)
        run: npm run verificar

      # 5. Descarga los navegadores que usa Playwright y sus dependencias del sistema.
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      # 6. Ejecuta todos los tests. Si alguno falla, el job queda en rojo y el PR no debería mergearse.
      - name: Run Playwright tests
        run: npx playwright test
        env:
          # Ambiente a probar. "demo" = sitio público de práctica. En un proyecto real: "qa".
          TEST_ENV: demo
          # Segunda barrera contra producción: si una URL contiene este texto, se corta la ejecución.
          # HOSTS_BLOQUEADOS: www.mi-empresa.com
          # Navegadores a usar (uno por proyecto). Para probar más de uno: chromium,firefox,webkit
          BROWSERS: chromium
          # En un proyecto real, el usuario y la clave van como "secrets" del repositorio:
          #   QA_USER: ${{ secrets.QA_USER }}
          #   QA_PASSWORD: ${{ secrets.QA_PASSWORD }}

      # 7. Sube el reporte HTML como "artefacto" descargable, incluso si los tests fallaron
      #    (la condición !cancelled() lo hace correr salvo que alguien cancele el workflow).
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30 # Días que se conserva el reporte.
